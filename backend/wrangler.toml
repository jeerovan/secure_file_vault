name = "fife"
compatibility_date = "2024-04-22"
compatibility_flags = [ "nodejs_compat" ]

main = "worker.ts"
workers_dev = true
preview_urls = false

[alias]
"@aws-sdk/xml-builder" = "@aws-sdk/xml-builder/dist-cjs/index.js"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Production activation; accepted uploads and cleanup continue if new entry is disabled.
MANAGED_UPLOADS_ENABLED = "true"
RECOVERY_RESET_ENABLED = "true"
RECOVERY_WORKER_READY = "true"
RECOVERY_RESET_EMAILS = "*"
# Recorded once after issuer accounting and rehearsal isolation; preserve this cutover.
RECOVERY_UPLOAD_ACCOUNTING_SINCE = "2026-10-23T11:06:30.458Z"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0452f8feb0c441a8a4e8babe57c28811"
# Miniflare requires a password field even though local PostgreSQL uses trust authentication.
localConnectionString = "postgres://jeerovan:local-dev@localhost:5432/fife"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "FIFE_AUTH_CACHE"
id = "81039fb51fc3427a90d657d09cd6bae4"
